name: Build Custom OPKG Feed (SmartDNS + Passwall)

on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间 10:00 自动更新
  workflow_dispatch: # 支持手动一键触发

permissions:
  contents: write
  pages: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and build usign
        run: |
          sudo apt-get update
          sudo apt-get install -y perl python3 gzip wget jq unzip cmake build-essential
          
          # 在临时目录编译并安装 usign，避免污染工作区
          git clone https://github.com/openwrt/usign.git /tmp/usign
          cd /tmp/usign && cmake . && make && sudo cp usign /usr/local/bin/

      - name: Download IPKs and Build Combined Index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          cd public

          # 通用下载函数：严格校验 URL 格式，彻底避免空值报错
          download_latest_release() {
            local repo=$1
            echo "=========================================="
            echo "Fetching latest release from: $repo"
            echo "=========================================="
            
            RELEASE_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest")
            
            # 1. 提取并下载 .ipk 文件 (过滤 null 与非 http 链接)
            echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name != null and (.name | endswith(".ipk"))) | .browser_download_url // empty' | while read -r url; do
              if [[ "$url" =~ ^https?:// ]]; then
                echo "Downloading IPK: $url"
                wget -q "$url" || echo "Warning: Failed to download $url"
              fi
            done

            # 2. 提取并下载 .zip 压缩包
            echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name != null and (.name | endswith(".zip"))) | .browser_download_url // empty' | while read -r url; do
              if [[ "$url" =~ ^https?:// ]]; then
                echo "Downloading ZIP archive: $url"
                wget -q "$url" -O temp.zip || echo "Warning: Failed to download $url"
                if [ -f temp.zip ]; then
                  unzip -o -q temp.zip || true
                  rm -f temp.zip
                fi
              fi
            done
          }

          # 【项目 1】SmartDNS 官方源
          download_latest_release "pymumu/smartdns"

          # 【项目 2】Passwall 官方主程序
          download_latest_release "Openwrt-Passwall/openwrt-passwall"

          # 【项目 3】Passwall 预编译依赖核心库
          download_latest_release "moetayuko/openwrt-passwall-build"

          # 整理目录：将嵌套子文件夹里的 ipk 统一移到根目录
          find . -mindepth 2 -type f -name "*.ipk" -exec mv {} . \; 2>/dev/null || true

          # 3. 下载索引生成脚本（增加 main/master 双分支备用，防止 404）
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/main/scripts/opkg-make-index.pl -O opkg-make-index.pl || \
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/opkg-make-index.pl -O opkg-make-index.pl || true

          if [ -f opkg-make-index.pl ]; then
            chmod +x opkg-make-index.pl
            ./opkg-make-index.pl . > Packages
            gzip -9 -c Packages > Packages.gz
            rm -f opkg-make-index.pl
          else
            echo "Error: Failed to fetch opkg-make-index.pl"
            exit 1
          fi

      - name: Sign Feed Index
        env:
          OPKG_SECRET: ${{ secrets.ISTOREOS_OPKG }}
        run: |
          if [ -z "$OPKG_SECRET" ]; then
            echo "Error: OPKG_SECRET_KEY is empty! Please verify repository Secrets."
            exit 1
          fi
          cd public
          echo "$OPKG_SECRET" > secret.key
          usign -S -m Packages.gz -s secret.key -x Packages.sig
          rm -f secret.key

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
