name: Build Custom OPKG Feed (SmartDNS + Passwall)

on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间 10:00 自动更新
  workflow_dispatch: # 支持手动一键触发

permissions:
  contents: write
  pages: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and build usign
        run: |
          sudo apt-get update
          sudo apt-get install -y perl python3 gzip wget jq unzip cmake build-essential
          
          # 在临时目录编译并安装 usign，彻底隔绝工作区污染
          git clone https://github.com/openwrt/usign.git /tmp/usign
          cd /tmp/usign && cmake . && make && sudo cp usign /usr/local/bin/

      - name: Download IPKs, Filter Arch & Build Combined Index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          cd public

          # 通用下载函数：校验链接防报错
          download_latest_release() {
            local repo=$1
            echo "=========================================="
            echo "Fetching latest release from: $repo"
            echo "=========================================="
            
            RELEASE_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest")
            
            # 1. 下载 .ipk 文件
            echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name != null and (.name | endswith(".ipk"))) | .browser_download_url // empty' | while read -r url; do
              if [[ "$url" =~ ^https?:// ]]; then
                echo "Downloading IPK: $url"
                wget -q "$url" || echo "Warning: Failed to download $url"
              fi
            done

            # 2. 下载并解压 .zip 压缩包
            echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name != null and (.name | endswith(".zip"))) | .browser_download_url // empty' | while read -r url; do
              if [[ "$url" =~ ^https?:// ]]; then
                echo "Downloading ZIP archive: $url"
                wget -q "$url" -O temp.zip || echo "Warning: Failed to download $url"
                if [ -f temp.zip ]; then
                  unzip -o -q temp.zip || true
                  rm -f temp.zip
                fi
              fi
            done
          }

          # 【项目 1】SmartDNS 官方源
          download_latest_release "pymumu/smartdns"

          # 【项目 2】Passwall 官方主程序
          download_latest_release "Openwrt-Passwall/openwrt-passwall"

          # 【项目 3】Passwall 预编译依赖核心库
          download_latest_release "moetayuko/openwrt-passwall-build"

          # 展平目录：把所有子文件夹里的 ipk 抽到当前根目录
          find . -mindepth 2 -type f -name "*.ipk" -exec mv {} . \; 2>/dev/null || true

          # ================= 【1. 精简与架构过滤：目标 x86_64】 =================
          TARGET_ARCH="x86_64"
          echo "Cleaning up non-x86_64 architectures and redundant translation packages..."

          # 清除非中文语言包（仅保留 zh-cn）
          find . -name "luci-i18n-*" ! -name "*zh-cn*" -type f -delete || true

          # 剔除其他 CPU 架构包（保留 x86_64 与 _all.ipk 通用包）
          for file in *.ipk; do
            [ -e "$file" ] || continue
            
            if [[ "$file" =~ (\.all|\_all) ]]; then
              continue
            fi

            if [[ "$file" == *"$TARGET_ARCH"* ]]; then
              continue
            fi

            if [[ "$file" =~ (aarch64|mips|arm_cortex|i386|riscv) ]]; then
              echo "Deleting non-x86_64 IPK: $file"
              rm -f "$file"
            fi
          done

          # ================= 【2. Passwall 版本适配：目标 iStoreOS 24.10】 =================
          echo "Cleaning up Passwall versions for iStoreOS 24.10..."

          # 删除所有 .apk 文件（24.10 依然使用 opkg，无法解析 apk）
          find . -type f -name "*.apk" -delete || true

          # 删除旧版 OpenWrt 22.03 版本的包（与 24.10 的 JS 界面不兼容）
          find . -type f -name "22.03-*" -delete || true

          # 剥离文件名开头的 "23.05-24.10_" 前缀
          for f in 23.05-24.10_*; do
            if [ -f "$f" ]; then
              mv "$f" "${f#23.05-24.10_}"
            fi
          done
          # ==============================================================

          # 生成包索引（指定 openwrt-23.05 分支获取脚本，避开已切换 apk-tools 的 main 分支）
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/openwrt-23.05/scripts/opkg-make-index.pl -O opkg-make-index.pl || \
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/openwrt-24.10/scripts/opkg-make-index.pl -O opkg-make-index.pl || true

          if [ -s opkg-make-index.pl ]; then
            chmod +x opkg-make-index.pl
            ./opkg-make-index.pl . > Packages
            rm -f opkg-make-index.pl
          else
            echo "Error: Failed to fetch opkg-make-index.pl"
            exit 1
          fi

          # 防错校验：确保 Packages 成功生成且非空
          if [ ! -s Packages ]; then
            echo "Error: Packages file is empty! No IPKs were indexed."
            exit 1
          fi

          gzip -9 -c Packages > Packages.gz

      - name: Sign Feed Index
        env:
          OPKG_SECRET: ${{ secrets.ISTOREOS_OPKG }}
        run: |
          if [ -z "$OPKG_SECRET" ]; then
            echo "Error: OPKG_SECRET is empty! Please verify repository Secrets."
            exit 1
          fi
          cd public
          
          if [ ! -s Packages ]; then
            echo "Error: Packages file does not exist or is empty."
            exit 1
          fi

          # 过滤换行符并处理 key 格式
          printf "%s\n" "$OPKG_SECRET" | tr -d '\r' > secret.key
          if ! grep -q "untrusted comment" secret.key; then
            echo "untrusted comment: secret key" > temp.key
            cat secret.key >> temp.key
            mv temp.key secret.key
          fi

          # 对解压后的 Packages 文本签名
          usign -S -m Packages -s secret.key -x Packages.sig
          rm -f secret.key

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
